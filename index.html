<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Laundry Bersih | Tugas Akhir Web</title>

    <!-- ===== CSS ===== -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #00c6ff, #0072ff);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            margin-bottom: 5px;
        }

        p {
            color: #555;
            margin-bottom: 20px;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 10px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            border: none;
            background: #0072ff;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #005bd1;
        }

        .hasil {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
        }

        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🧺 Laundry Bersih</h1>
        <p>Cepat • Bersih • Terpercaya</p>

        <label>Nama Pelanggan</label>
        <input type="text" id="nama" placeholder="Masukkan nama">

        <label>Berat Laundry (Kg)</label>
        <input type="number" id="berat" placeholder="Contoh: 5">

        <button onclick="hitungLaundry()">Hitung Total</button>

        <div class="hasil" id="output"></div>

        <footer>
            © 2025 | Tugas Akhir Program Web
        </footer>
    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        function hitungLaundry() {
            let nama = document.getElementById("nama").value;
            let berat = document.getElementById("berat").value;
            let hargaPerKg = 7000;

            if (nama === "" || berat === "") {
                alert("Lengkapi data terlebih dahulu!");
                return;
            }

            let total = berat * hargaPerKg;

            document.getElementById("output").innerHTML =
                "Nama: " + nama + "<br>" +
                "Berat: " + berat + " Kg<br>" +
                "Total Bayar: Rp " + total.toLocaleString("id-ID");

            console.log("Nama:", nama);
            console.log("Berat:", berat);
            console.log("Total:", total);
        }
    </script>

</body>
</html>
